<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jersey Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <figure>
        <img src="img/jersey.jpg" alt="Manchester City Jersey 2026/2027 Away" />
        <figcaption>
          <h2>PUMA SPORTSWEAR</h2>
          <h3>Manchester City Jersey 2026/2027 Away</h3>
          <p>
            White dominates the kit, highlighting the central stripe composed of light and dark
            blue.
          </p>
        </figcaption>
      </figure>
      <div class="price_tag">
        <span class="discount_price">Rp. 1.200.000,00</span>
        <span class="real_price">Rp. 1.500.000,00</span>
      </div>
      <div class="sizing">
        <h3>Sizing (IND):</h3>
        <div class="size_button">
          <button type="button">S</button>
          <button type="button">M</button>
          <button type="button">L</button>
          <button type="button">XL</button>
          <button type="button">XLL</button>
        </div>
      </div>
      <div class="add_to_cart">
        <button type="button">
          <p>ADD TO CART</p>
        </button>
      </div>
    </div>
  </body>
</html>
