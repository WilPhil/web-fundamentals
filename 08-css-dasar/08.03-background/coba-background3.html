<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background Color</title>
    <style>
      body {
        min-height: 100vh;
        background-image: linear-gradient(to bottom left, lightblue, lightcoral);
      }

      .kotak1 {
        width: 200px;
        height: 200px;
        background-image: linear-gradient(palegoldenrod, teal);
      }

      .kotak2 {
        width: 200px;
        height: 200px;
        background-image: radial-gradient(blue, red);
      }

      .kotak3 {
        width: 200px;
        height: 200px;
        background-image: conic-gradient(red, green, white, purple, blue);
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
