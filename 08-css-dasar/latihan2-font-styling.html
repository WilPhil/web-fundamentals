<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 2: Font Styling</title>
    <style>
      body {
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        text-align: center;
      }

      h1 {
        font-size: 48px;
        font-style: italic;
        letter-spacing: 15px;
        word-spacing: 20px;
        text-transform: uppercase;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: gray;
        text-shadow: 6px 6px 4px dimgray;
      }

      p {
        font-size: 24px;
        line-height: 3;
        word-spacing: 15px;
      }

      .linethrough {
        color: gray;
        text-decoration: line-through;
        text-decoration-thickness: 3px;
      }

      .span {
        font-size: 12px;
        color: gray;
        word-spacing: 5px;
        letter-spacing: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Fase Runtuh</h1>
    <p>
      "Tak perlu khawatir, ku hanya <span class="linethrough">terluka</span>. <br />
      Terbiasa tuk pura-pura tertawa. <br />
      Namun bolehkah sekali saja ku menangis? <br />
      Sebelum kembali membohongi diri.""
    </p>
    <span class="span">- feby putri feat. fiersa besari</span>
  </body>
</html>
