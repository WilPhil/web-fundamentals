<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba list html</title>
  </head>
  <body>
    <h2>Ordered List / List Berurut</h2>
    <ol type="1">
      <li>
        <p>Item 1</p>
      </li>
      <li>
        <p>Item 2</p>
      </li>
      <li>
        <p>Item 3</p>
      </li>
      <li>
        <p>Item 4</p>
      </li>
    </ol>

    <h2>Unordered List / List Tidak Berurut</h2>
    <ul type="circle">
      <li>
        <p>Item 1</p>
      </li>
      <li>
        <p>Item 2</p>
      </li>
      <li>
        <p>Item 3</p>
      </li>
      <li>
        <p>Item 4</p>
      </li>
    </ul>

    <h2>Description List</h2>
    <dl>
      <dt>HTML</dt>
      <dd>Hypertext Markup Language</dd>
      <dt>CSS</dt>
      <dd>Cascading Style Sheet</dd>
    </dl>
  </body>
</html>
