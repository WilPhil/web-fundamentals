<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Rich Player Tag</title>
  </head>
  <body>
    <h3>Video Player</h3>
    <video controls poster="images/test.jpg" width="400">
      <source src="media/video.mp4" type="video/mp4" />
      <source src="media/video.webm" type="video/webm" />
      Your browser don't support video player.
    </video>

    <hr />

    <h3>Audio Player</h3>
    <audio controls>
      <source src="media/audio.mp3" />
      Your browser don't support audio player.
    </audio>
  </body>
</html>
