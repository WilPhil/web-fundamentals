<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Div & Span</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f3f3f3;
      }

      .kotak {
        width: 25%;
        background-color: #eee;
        padding: 15px;
        border: 2px solid black;
      }

      .highlight {
        background-color: pink;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Perbedaan Div dan Span</h1>
    <div class="kotak">
      <h2>Ini adalah Judul Artikel</h2>
      <p>
        Div adalah elemen <strong>block</strong>. Lihat bagaimana kotak abu-abu ini membungkus
        seluruh konten artikel. Di dalam paragraf ini, kita akan menggunakan span untuk memberi
        <span class="highlight">style</span>
        pada kata-kata tertentu.
      </p>
    </div>
  </body>
</html>
